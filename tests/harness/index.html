<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- The same policy as the site (vite.config.ts), so blob: images and the worker are tested under it. -->
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'self'"
		/>
		<link rel="icon" href="data:," />
		<title>Falette export test page</title>
	</head>
	<body>
		<h1>Falette export test page</h1>
		<p>Test page for src/lib/export. It is not part of the site.</p>
		<p><a href="?run=device">Run the device checks</a></p>
		<p id="status"></p>
		<div id="results"></div>
		<!-- A text area, so phones offer Select All to copy the results. -->
		<textarea id="json" rows="12" cols="60" readonly></textarea>
		<script type="module" src="./main.ts"></script>
	</body>
</html>
